<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ESP Verben">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>ESP Verb Trainer</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f4f6;background:#090d14;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090d14}main{max-width:620px;margin:auto;padding:20px 16px 100px}h1{font-size:26px;margin:8px 0 4px}.sub{color:#9ca3af;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box,button{border:0;border-radius:14px;background:#151b26;padding:16px;box-shadow:0 1px 3px #0001;font-size:16px}.box{text-align:left}.box b{display:block;font-size:26px;margin-top:5px}.primary{background:#2563eb;color:#fff;width:100%;margin:14px 0}.card{background:#151b26;border-radius:20px;padding:28px 20px;min-height:310px;box-shadow:0 2px 10px #0001;text-align:center;display:flex;flex-direction:column;justify-content:center}.verb{font-size:38px;font-weight:750}.meaning{font-size:19px;color:#9ca3af;margin-top:8px}.badge{display:inline-block;background:#273244;border-radius:999px;padding:5px 10px;font-size:13px;margin-bottom:18px}.forms{display:grid;grid-template-columns:1fr 1fr;text-align:left;gap:10px;margin-top:18px}.forms span{background:#0f1520;padding:10px;border-radius:10px}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;font-size:25px}.hide{display:none}.nav{display:flex;gap:8px;overflow:auto;margin:14px 0}.nav button{white-space:nowrap;padding:10px 12px}.muted{color:#9ca3af}.top{display:flex;justify-content:space-between;align-items:center}.link{background:transparent;box-shadow:none;padding:8px}.panel{background:#151b26;border-radius:16px;padding:16px;margin-top:14px}input{width:100%;padding:12px;margin:5px 0;border:1px solid #374151;background:#0f1520;color:#f3f4f6;border-radius:10px;font-size:16px}.small{font-size:13px}.progress{margin:10px 0;color:#9ca3af;text-align:center}
</style></head><body><main>
<div class="top"><div><h1>ESP · Verb Trainer</h1><p class="sub">4-Fächer-Lernsystem</p></div><button class="link" onclick="showManage()">⚙︎</button></div>
<section id="home"><div class="grid" id="boxes"></div><button class="primary" onclick="startDue()">Heute lernen</button>
<div class="nav"><button onclick="startBox(1)">Fach 1</button><button onclick="startBox(2)">Fach 2</button><button onclick="startBox(3)">Fach 3</button><button onclick="startBox(4)">Fach 4</button><button onclick="startQuick()">10 Karten</button></div>
<p class="muted small">Intervalle: Fach 1 sofort · Fach 2 nach 2 Tagen · Fach 3 nach 5 Tagen · Fach 4 nach 14 Tagen.</p></section>
<section id="learn" class="hide"><div class="progress" id="progress"></div><div class="card"><div id="front"><div class="badge" id="badge"></div><div class="verb" id="verb"></div><div class="meaning" id="meaning"></div><button class="primary" onclick="reveal()">Lösung anzeigen</button></div>
<div id="back" class="hide"><div class="verb" id="verb2"></div><div class="forms" id="forms"></div></div></div>
<div class="actions hide" id="actions"><button onclick="rate(false)">👎</button><button onclick="rate(true)">👍</button></div>
<button class="link" onclick="goHome()">← Beenden</button></section>
<section id="manage" class="hide"><div class="panel"><h2>Verb hinzufügen</h2><input id="inf" placeholder="Infinitiv"><input id="de" placeholder="Deutsch"><input id="yo" placeholder="yo"><input id="tu" placeholder="tú"><input id="el" placeholder="él/ella"><input id="nos" placeholder="nosotros"><input id="vos" placeholder="vosotros"><input id="ellos" placeholder="ellos/ellas"><button class="primary" onclick="addVerb()">Speichern → Fach 1</button></div>
<div class="panel"><h2>Backup</h2><button onclick="exportData()">Backup exportieren</button> <button onclick="document.getElementById('imp').click()">Backup importieren</button><input class="hide" type="file" id="imp" accept=".json" onchange="importData(event)"><p class="small muted">Fortschritt und eigene Karten werden lokal auf diesem Gerät gespeichert.</p></div>
<button class="link" onclick="goHome()">← Zurück</button></section>
<script>
const seed=[["ser","sein",["soy","eres","es","somos","sois","son"]],["estar","sein / sich befinden",["estoy","estás","está","estamos","estáis","están"]],["tener","haben",["tengo","tienes","tiene","tenemos","tenéis","tienen"]],["hacer","machen / tun",["hago","haces","hace","hacemos","hacéis","hacen"]],["ir","gehen / fahren",["voy","vas","va","vamos","vais","van"]],["querer","wollen / mögen",["quiero","quieres","quiere","queremos","queréis","quieren"]],["hablar","sprechen",["hablo","hablas","habla","hablamos","habláis","hablan"]],["comer","essen",["como","comes","come","comemos","coméis","comen"]],["vivir","leben",["vivo","vives","vive","vivimos","vivís","viven"]],["aprender","lernen",["aprendo","aprendes","aprende","aprendemos","aprendéis","aprenden"]],["trabajar","arbeiten",["trabajo","trabajas","trabaja","trabajamos","trabajáis","trabajan"]],["necesitar","benötigen",["necesito","necesitas","necesita","necesitamos","necesitáis","necesitan"]],["ver","sehen",["veo","ves","ve","vemos","veis","ven"]],["dar","geben",["doy","das","da","damos","dais","dan"]],["decir","sagen",["digo","dices","dice","decimos","decís","dicen"]],["poder","können",["puedo","puedes","puede","podemos","podéis","pueden"]],["venir","kommen",["vengo","vienes","viene","venimos","venís","vienen"]],["saber","wissen",["sé","sabes","sabe","sabemos","sabéis","saben"]],["comprar","kaufen",["compro","compras","compra","compramos","compráis","compran"]],["vender","verkaufen",["vendo","vendes","vende","vendemos","vendéis","venden"]],["pagar","bezahlen",["pago","pagas","paga","pagamos","pagáis","pagan"]],["buscar","suchen",["busco","buscas","busca","buscamos","buscáis","buscan"]],["encontrar","finden",["encuentro","encuentras","encuentra","encontramos","encontráis","encuentran"]],["tomar","nehmen / trinken",["tomo","tomas","toma","tomamos","tomáis","toman"]],["abrir","öffnen",["abro","abres","abre","abrimos","abrís","abren"]],["cerrar","schließen",["cierro","cierras","cierra","cerramos","cerráis","cierran"]],["esperar","warten / hoffen",["espero","esperas","espera","esperamos","esperáis","esperan"]],["preguntar","fragen",["pregunto","preguntas","pregunta","preguntamos","preguntáis","preguntan"]],["responder","antworten",["respondo","respondes","responde","respondemos","respondéis","responden"]],["leer","lesen",["leo","lees","lee","leemos","leéis","leen"]],["escribir","schreiben",["escribo","escribes","escribe","escribimos","escribís","escriben"]],["escuchar","zuhören / anhören",["escucho","escuchas","escucha","escuchamos","escucháis","escuchan"]],["llevar","tragen / mitnehmen",["llevo","llevas","lleva","llevamos","lleváis","llevan"]],["traer","bringen",["traigo","traes","trae","traemos","traéis","traen"]],["quedarse","bleiben",["me quedo","te quedas","se queda","nos quedamos","os quedáis","se quedan"]],["mirar","anschauen",["miro","miras","mira","miramos","miráis","miran"]],["usar","benutzen",["uso","usas","usa","usamos","usáis","usan"]],["empezar","anfangen",["empiezo","empiezas","empieza","empezamos","empezáis","empiezan"]],["terminar","beenden",["termino","terminas","termina","terminamos","termináis","terminan"]],["ayudar","helfen",["ayudo","ayudas","ayuda","ayudamos","ayudáis","ayudan"]],["sentirse","sich fühlen",["me siento","te sientes","se siente","nos sentimos","os sentís","se sienten"]],["pensar","denken",["pienso","piensas","piensa","pensamos","pensáis","piensan"]],["perder","verlieren",["pierdo","pierdes","pierde","perdemos","perdéis","pierden"]],["recordar","sich erinnern",["recuerdo","recuerdas","recuerda","recordamos","recordáis","recuerdan"]],["enviar","senden",["envío","envías","envía","enviamos","enviáis","envían"]],["recibir","erhalten",["recibo","recibes","recibe","recibimos","recibís","reciben"]],["gustar","gefallen / mögen",["me gusta","te gusta","le gusta","nos gusta","os gusta","les gusta"]],["deber","sollen / müssen",["debo","debes","debe","debemos","debéis","deben"]],["planear","planen",["planeo","planeas","planea","planeamos","planeáis","planean"]],["decidir","entscheiden",["decido","decides","decide","decidimos","decidís","deciden"]],["explicar","erklären",["explico","explicas","explica","explicamos","explicáis","explican"]],["intentar","versuchen",["intento","intentas","intenta","intentamos","intentáis","intentan"]],["acordar","vereinbaren",["acuerdo","acuerdas","acuerda","acordamos","acordáis","acuerdan"]],["mandar","senden / schicken",["mando","mandas","manda","mandamos","mandáis","mandan"]],["seguir","folgen / weitermachen",["sigo","sigues","sigue","seguimos","seguís","siguen"]],["comprobar","prüfen / überprüfen",["compruebo","compruebas","comprueba","comprobamos","comprobáis","comprueban"]],["proponer","vorschlagen",["propongo","propones","propone","proponemos","proponéis","proponen"]],["aceptar","akzeptieren",["acepto","aceptas","acepta","aceptamos","aceptáis","aceptan"]],["rechazar","ablehnen",["rechazo","rechazas","rechaza","rechazamos","rechazáis","rechazan"]],["continuar","fortsetzen / weitermachen",["continúo","continúas","continúa","continuamos","continuáis","continúan"]]];
const K="espVerbTrainerV1", intervals={1:0,2:2,3:5,4:14}; let cards=[],queue=[],idx=0;
function init(){let saved=localStorage.getItem(K);cards=saved?JSON.parse(saved):[];seed.forEach((x,i)=>{let old=cards.find(c=>c.inf===x[0]);if(old){old.de=x[1];old.forms=x[2]}else cards.push({id:"seed-"+x[0],inf:x[0],de:x[1],forms:x[2],box:1,due:Date.now(),correct:0,wrong:0})});save();renderBoxes()}
function save(){localStorage.setItem(K,JSON.stringify(cards))}
function renderBoxes(){document.getElementById("boxes").innerHTML=[1,2,3,4].map(b=>'<button class="box" onclick="startBox('+b+')">Fach '+b+'<b>'+cards.filter(c=>c.box===b).length+'</b></button>').join("")}
function show(s){["home","learn","manage"].forEach(x=>document.getElementById(x).classList.toggle("hide",x!==s))}
function goHome(){show("home");renderBoxes()} function showManage(){show("manage")}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function startDue(){start(cards.filter(c=>c.due<=Date.now()))} function startBox(b){start(cards.filter(c=>c.box===b))} function startQuick(){start(shuffle([...cards]).slice(0,10))}
function start(a){queue=shuffle([...a]);idx=0;if(!queue.length){alert("Keine Karten fällig.");return}show("learn");draw()}
function draw(){let c=queue[idx];if(!c){alert("Training abgeschlossen.");goHome();return}document.getElementById("progress").textContent=(idx+1)+" / "+queue.length;document.getElementById("badge").textContent="Fach "+c.box;document.getElementById("verb").textContent=c.inf;document.getElementById("verb2").textContent=c.inf;document.getElementById("meaning").textContent=c.de;document.getElementById("forms").innerHTML=["yo","tú","él/ella","nosotros","vosotros","ellos"].map((p,i)=>"<span><b>"+p+"</b><br>"+c.forms[i]+"</span>").join("");document.getElementById("front").classList.remove("hide");document.getElementById("back").classList.add("hide");document.getElementById("actions").classList.add("hide")}
function reveal(){document.getElementById("front").classList.add("hide");document.getElementById("back").classList.remove("hide");document.getElementById("actions").classList.remove("hide")}
function rate(ok){let c=queue[idx],real=cards.find(x=>x.id===c.id);if(ok){real.correct++;if(real.box<4)real.box++}else{real.wrong++;if(real.box===4)real.box=3}real.due=Date.now()+intervals[real.box]*86400000;save();idx++;draw()}
function addVerb(){let ids=["inf","de","yo","tu","el","nos","vos","ellos"],v=ids.map(x=>document.getElementById(x).value.trim());if(v.some(x=>!x)){alert("Bitte alle Felder ausfüllen.");return}cards.push({id:Date.now(),inf:v[0],de:v[1],forms:v.slice(2),box:1,due:Date.now(),correct:0,wrong:0});save();ids.forEach(x=>document.getElementById(x).value="");alert("Verb gespeichert.")} 
function exportData(){let b=new Blob([JSON.stringify(cards,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="esp-verb-trainer-backup.json";a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;cards=d;save();renderBoxes();alert("Backup importiert.")}catch(_){alert("Ungültige Backup-Datei.")}};r.readAsText(f)}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");init();
</script></main></body></html>
